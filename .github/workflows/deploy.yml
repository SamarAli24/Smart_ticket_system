name: Deploy to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FRONTEND_DIR: Frontend
  BACKEND_PROJECT: Backend/TicketSystem.Api/TicketSystem.Api.csproj
  WWWROOT_DIR: Backend/TicketSystem.Api/wwwroot

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      # The SPA is served by the API itself, so the Vite build has to live in wwwroot
      # before the .NET project is published. wwwroot is wiped first so files removed
      # from the frontend never linger in a deployment.
      - name: Copy frontend build into backend wwwroot
        shell: pwsh
        run: |
          if (Test-Path "${{ env.WWWROOT_DIR }}") {
            Remove-Item "${{ env.WWWROOT_DIR }}" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "${{ env.WWWROOT_DIR }}" -Force | Out-Null
          Copy-Item -Path "${{ env.FRONTEND_DIR }}/dist/*" -Destination "${{ env.WWWROOT_DIR }}" -Recurse -Force
          Get-ChildItem "${{ env.WWWROOT_DIR }}" -Recurse | Select-Object -ExpandProperty FullName

      # Matches <TargetFramework>net8.0</TargetFramework> in TicketSystem.Api.csproj.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ${{ env.BACKEND_PROJECT }} --runtime win-x86

      # MonsterASP.NET application pools run 32-bit, hence win-x86.
      # --no-self-contained keeps the shared framework on the host.
      - name: Publish
        run: dotnet publish ${{ env.BACKEND_PROJECT }} -c Release -o ./publish --runtime win-x86 --no-self-contained --no-restore

      # Secrets never live in the repo: appsettings.json ships with a throwaway local key and
      # an empty AI key, both replaced here from encrypted GitHub secrets just before deploy.
      - name: Inject secrets into published config
        shell: pwsh
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JWT_KEY)) {
            throw "Secret JWT_KEY is not set. Add it under Settings > Secrets and variables > Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:AI_API_KEY)) {
            throw "Secret AI_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
          }

          $path = "./publish/appsettings.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.Jwt.PSObject.Properties.Remove("_comment")
          $json.Jwt.Key = $env:JWT_KEY
          $json.AiApi.ApiKey = $env:AI_API_KEY
          $json | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8

          # Confirm the placeholders are gone without printing the secrets themselves.
          $check = Get-Content $path -Raw | ConvertFrom-Json
          if ($check.Jwt.Key -like "local-development-only*") { throw "JWT key was not replaced." }
          if ([string]::IsNullOrWhiteSpace($check.AiApi.ApiKey)) { throw "AI key was not replaced." }
          Write-Host "Injected Jwt:Key ($($check.Jwt.Key.Length) chars) and AiApi:ApiKey ($($check.AiApi.ApiKey.Length) chars)."

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
